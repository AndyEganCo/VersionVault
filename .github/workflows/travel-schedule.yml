name: Travel Schedule Sync

on:
  schedule:
    # Every 6 hours (matches n8n workflow interval)
    - cron: "30 */6 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/calendar-sync/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scripts/calendar-sync

      - name: Sync Travel Schedule → Google Calendar
        run: npm run sync:travel
        working-directory: scripts/calendar-sync
        env:
          SMARTSHEET_BEARER_TOKEN: ${{ secrets.SMARTSHEET_BEARER_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
